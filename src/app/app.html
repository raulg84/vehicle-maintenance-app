<header class="app-header">
  <div class="app-header__inner">
    <a routerLink="/vehicles" class="app-header__logo">
      <img src="assets/images/logo-navbar.png" alt="PreventDrive" class="logo-image">
    </a>

    <nav class="app-header__nav">
      <a class="app-header__link" routerLink="/vehicles" routerLinkActive="app-header__link--active">
        Vehículos
      </a>

      @if (authService.isAdmin()) {
      <a class="app-header__link" routerLink="/rules" routerLinkActive="app-header__link--active">
        Reglas
      </a>
      }
    </nav>

    <div class="app-header__user">
      <span class="app-header__user-info">
        {{ authService.getCurrentUser()?.name }} · {{
        authService.getCurrentUser()?.role === 'admin'
        ? 'Administrador'
        : 'Usuario'
        }}
      </span>

      <button type="button" class="app-header__logout" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</header>

<main class="app__main">
  <router-outlet></router-outlet>
</main>
